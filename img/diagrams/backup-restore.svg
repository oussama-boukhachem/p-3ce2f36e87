<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#17160f"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c2411d"/></marker></defs><rect width="1600" height="900" fill="#fbf8f1"/><rect x="62" y="250" width="250" height="110" fill="#fffdf7" stroke="#17160f" stroke-width="1.4"/><text x="80" y="286" font-family="Lato,Arial,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#17160f">cron 02:00</text><text x="80" y="312" font-family="DejaVu Sans Mono,monospace" font-size="13.5" font-weight="400" fill="#6b6757">systemd timer</text><rect x="367" y="250" width="250" height="110" fill="#fffdf7" stroke="#17160f" stroke-width="1.4"/><text x="385" y="286" font-family="Lato,Arial,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#17160f">rsync</text><text x="385" y="312" font-family="DejaVu Sans Mono,monospace" font-size="13.5" font-weight="400" fill="#6b6757">delta only</text><line x1="314" y1="305" x2="363" y2="305" stroke="#17160f" stroke-width="1.4" marker-end="url(#ah)"/><rect x="672" y="250" width="250" height="110" fill="#fffdf7" stroke="#17160f" stroke-width="1.4"/><text x="690" y="286" font-family="Lato,Arial,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#17160f">Snapshot</text><text x="690" y="312" font-family="DejaVu Sans Mono,monospace" font-size="13.5" font-weight="400" fill="#6b6757">hard-link chain</text><line x1="619" y1="305" x2="668" y2="305" stroke="#17160f" stroke-width="1.4" marker-end="url(#ah)"/><rect x="977" y="250" width="250" height="110" fill="#fffdf7" stroke="#17160f" stroke-width="1.4"/><text x="995" y="286" font-family="Lato,Arial,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#17160f">Prune</text><text x="995" y="312" font-family="DejaVu Sans Mono,monospace" font-size="13.5" font-weight="400" fill="#6b6757">retention policy</text><line x1="924" y1="305" x2="973" y2="305" stroke="#17160f" stroke-width="1.4" marker-end="url(#ah)"/><rect x="1282" y="250" width="250" height="110" fill="#fffdf7" stroke="#c2411d" stroke-width="2.2"/><text x="1300" y="286" font-family="Lato,Arial,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#17160f">Verify</text><text x="1300" y="312" font-family="DejaVu Sans Mono,monospace" font-size="13.5" font-weight="400" fill="#6b6757">read back the data</text><line x1="1229" y1="305" x2="1278" y2="305" stroke="#17160f" stroke-width="1.4" marker-end="url(#ah)"/><rect x="62" y="470" width="340" height="120" fill="#fffdf7" stroke="#17160f" stroke-width="1.4"/><text x="80" y="506" font-family="Lato,Arial,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#17160f">Status file</text><text x="80" y="532" font-family="DejaVu Sans Mono,monospace" font-size="13.5" font-weight="400" fill="#6b6757">one record per run</text><rect x="430" y="470" width="340" height="120" fill="#fffdf7" stroke="#17160f" stroke-width="1.4"/><text x="448" y="506" font-family="Lato,Arial,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#17160f">Textfile exporter</text><text x="448" y="532" font-family="DejaVu Sans Mono,monospace" font-size="13.5" font-weight="400" fill="#6b6757">Prometheus reads it</text><rect x="798" y="470" width="340" height="120" fill="#fffdf7" stroke="#17160f" stroke-width="1.4"/><text x="816" y="506" font-family="Lato,Arial,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#17160f">Grafana</text><text x="816" y="532" font-family="DejaVu Sans Mono,monospace" font-size="13.5" font-weight="400" fill="#6b6757">last run, bytes, verify</text><line x1="232" y1="360" x2="232" y2="468" stroke="#17160f" stroke-width="1.4" marker-end="url(#ah)" stroke-dasharray="6 5"/><line x1="402" y1="530" x2="428" y2="530" stroke="#17160f" stroke-width="1.4" marker-end="url(#ah)"/><line x1="770" y1="530" x2="796" y2="530" stroke="#17160f" stroke-width="1.4" marker-end="url(#ah)"/><text x="62" y="700" font-family="Lato,Arial,Helvetica,sans-serif" font-size="20" font-weight="800" fill="#17160f">Backed up and recoverable are two different facts.</text><text x="62" y="730" font-family="DejaVu Sans Mono,monospace" font-size="16" font-weight="400" fill="#6b6757">Only one of them is worth anything.</text></svg>