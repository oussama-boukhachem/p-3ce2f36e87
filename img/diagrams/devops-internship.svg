<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#17160f"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c2411d"/></marker></defs><rect width="1600" height="900" fill="#fbf8f1"/><rect x="62" y="250" width="250" height="110" fill="#fffdf7" stroke="#17160f" stroke-width="1.4"/><text x="80" y="286" font-family="Lato,Arial,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#17160f">Repository</text><text x="80" y="312" font-family="DejaVu Sans Mono,monospace" font-size="13.5" font-weight="400" fill="#6b6757">branch · PR</text><rect x="367" y="250" width="250" height="110" fill="#fffdf7" stroke="#17160f" stroke-width="1.4"/><text x="385" y="286" font-family="Lato,Arial,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#17160f">GitHub Actions</text><text x="385" y="312" font-family="DejaVu Sans Mono,monospace" font-size="13.5" font-weight="400" fill="#6b6757">build · test</text><line x1="314" y1="305" x2="363" y2="305" stroke="#17160f" stroke-width="1.4" marker-end="url(#ah)"/><rect x="672" y="250" width="250" height="110" fill="#fffdf7" stroke="#17160f" stroke-width="1.4"/><text x="690" y="286" font-family="Lato,Arial,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#17160f">Docker image</text><text x="690" y="312" font-family="DejaVu Sans Mono,monospace" font-size="13.5" font-weight="400" fill="#6b6757">registry</text><line x1="619" y1="305" x2="668" y2="305" stroke="#17160f" stroke-width="1.4" marker-end="url(#ah)"/><rect x="977" y="250" width="250" height="110" fill="#fffdf7" stroke="#17160f" stroke-width="1.4"/><text x="995" y="286" font-family="Lato,Arial,Helvetica,sans-serif" font-size="22" font-weight="800" fill="#17160f